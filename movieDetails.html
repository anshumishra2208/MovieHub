<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie Details</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="details-page">


    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <a
            href="index.html"
            class="brand"
            aria-label="MovieHub home"
        >

            <svg
                class="brand-icon"
                fill="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v3h2.5l1.5-3H4zm4.5 0l-1.5 3h3l1.5-3H8.5zm5 0l-1.5 3h3l1.5-3h-3zm5 0l-1.5 3H20V6h-1.5zM4 11v7h16v-7H4z"/>

            </svg>

            <span>
                MovieHub
            </span>

        </a>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <div class="details-shell">


            <!-- BACK BUTTON -->

            <a
                href="index.html"
                class="back-link"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"
                    />

                </svg>

                Back to Search

            </a>


            <!-- IMPORTANT:
                 id="movieDetail" SAME hai.
                 movieDetails.js isi ke andar
                 movie information insert karega.
            -->

            <div id="movieDetail"></div>

        </div>

    </main>


    <!-- ================= EXISTING JS ================= -->

    <script src="movieDetails.js"></script>

</body>
</html>
