<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="home-page">

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <a href="index.html" class="brand" aria-label="MovieHub home">

            <svg
                class="brand-icon"
                fill="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v3h2.5l1.5-3H4zm4.5 0l-1.5 3h3l1.5-3H8.5zm5 0l-1.5 3h3l-1.5-3h-3zm5 0l-1.5 3H20V6h-1.5zM4 11v7h16v-7H4z"/>
            </svg>

            <span>MovieHub</span>

        </a>


        <a href="#form" class="header-search-link">
            Search Movies
        </a>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <!-- ================= HERO ================= -->

        <section class="hero">

            <div class="hero-content">

                <span class="eyebrow">
                    MOVIE SEARCH
                </span>

                <h1>
                    Find your next movie.
                </h1>

                <p>
                    Search thousands of movies and explore their details
                    in one clean place.
                </p>

                <a href="#form" class="hero-cta">

                    Search Now

                    <svg
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M19 14l-7 7m0 0l-7-7m7 7V3"
                        />
                    </svg>

                </a>

            </div>

        </section>


        <!-- ================= SEARCH SECTION ================= -->

        <section class="search-section" aria-label="Movie search">

            <div class="section-heading">

                <span>
                    Search
                </span>

                <h2>
                    What do you want to watch?
                </h2>

            </div>


            <!-- IMPORTANT:
                 id="form" SAME hai
                 JS ko touch nahi kiya
            -->

            <form action="" id="form">

                <div class="search-input-wrap">

                    <svg
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                        />
                    </svg>

                    <!-- IMPORTANT:
                         id="input" SAME hai
                    -->

                    <input
                        type="text"
                        id="input"
                        placeholder="Enter a movie name"
                        autocomplete="off"
                    >

                </div>


                <button type="submit">
                    Search
                </button>

            </form>


            <!-- IMPORTANT:
                 id="movieList" SAME hai
                 JS isi ke andar movie cards banayega
            -->

            <div id="movieList"></div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer">

        <span>
            MovieHub
        </span>

        <span>
            Search. Discover. Watch.
        </span>

    </footer>


    <!-- ================= EXISTING JS ================= -->

    <script src="script.js"></script>

</body>
</html>
